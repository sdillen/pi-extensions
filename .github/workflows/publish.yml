name: Publish

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - run: npm ci

      - name: Test
        run: npm test

      - name: Publish @sdillen/pi-ssh
        run: npm publish --workspace ssh --access public

      - name: Publish @sdillen/pi-brave-search
        run: npm publish --workspace brave-search --access public
